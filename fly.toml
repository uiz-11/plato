# Fly.io deployment (§12.2). One machine, always running, with the SQLite file
# on a persistent volume. Set `app` and `primary_region` to your own, then see
# README.md › Deployment.

app = "plato"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # The image already sets NODE_ENV, PORT and PLATO_DB_PATH=/data/plato.db.
  # PLATO_PASSCODE and PLATO_COOKIE_SECRET are secrets: `fly secrets set`.
  PLATO_TIME_ZONE = "UTC"

[mounts]
  source = "plato_data"
  destination = "/data"
  # Daily snapshots are the primary backup. Keep them for 30 days (1–60).
  scheduled_snapshots = true
  snapshot_retention = 30

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite has one writer: exactly one machine, never stopped (§12.2).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    # The unlock page answers 200 without the passcode and reads no data.
    path = "/unlock"

# Canary and blue-green deploys cannot use machines with volumes; the default
# rolling strategy stops the one machine and starts the new image on it.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
