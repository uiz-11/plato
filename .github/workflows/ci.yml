name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # content:check compares the branch with its merge base on main.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker image
        run: docker build -t plato:ci .

      - name: Docker smoke check
        run: |
          # Without a passcode the server refuses to start (§8.5). Check the
          # message too, so an unrelated crash at start does not pass.
          code=0; out=$(timeout 30 docker run --rm --init plato:ci 2>&1) || code=$?
          echo "$out"
          test "$code" = 1 || { echo "expected exit 1 without PLATO_PASSCODE, got $code"; exit 1; }
          echo "$out" | grep -q "Auth configuration is invalid"
          docker run -d --name plato -p 3000:3000 \
            -e PLATO_PASSCODE=ci-passcode-at-least-20-chars \
            -e PLATO_COOKIE_SECRET=ci-cookie-secret \
            plato:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/unlock -o /tmp/unlock.html; then break; fi
            sleep 1
          done
          docker logs plato
          grep -q "Plato" /tmp/unlock.html
          # Locked: the proxy redirects home to /unlock.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          test "$status" = 307 || { echo "locked home answered $status"; exit 1; }
          # The passcode as a bearer token reaches the placeholder home.
          curl -fsS -H 'authorization: Bearer ci-passcode-at-least-20-chars' \
            http://127.0.0.1:3000/ -o /tmp/home.html
          grep -q "Nothing here yet." /tmp/home.html
          # Migrations ran at start (instrumentation.ts) on the volume's DB file.
          docker exec plato node -e "
            const db = require('better-sqlite3')(process.env.PLATO_DB_PATH, { readonly: true, fileMustExist: true });
            const n = db.prepare(\"SELECT count(*) FROM sqlite_master WHERE type = 'table' AND name = 'session'\").pluck().get();
            if (n !== 1) { console.error('migrations did not run'); process.exit(1) }
            console.log('migrations applied')
          "
          # The image never turns on test hooks (§10.1), so the clock route is hidden.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"days":1}' \
            http://127.0.0.1:3000/api/test/clock)
          test "$status" = 404 || { echo "test clock route answered $status"; exit 1; }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Content check
        # The script arrives with T07. It runs the display check (§11.4), which
        # needs the build and the browser, so it comes after both.
        run: npm run content:check --if-present

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
