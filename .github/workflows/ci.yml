name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # content:check compares the branch with its merge base on main.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker image
        run: docker build -t plato:ci .

      - name: Docker smoke check
        # -L follows the redirect to /unlock once auth exists (T03).
        run: |
          docker run -d --name plato -p 3000:3000 \
            -e PLATO_PASSCODE=ci-passcode-at-least-20-chars \
            -e PLATO_COOKIE_SECRET=ci-cookie-secret \
            plato:ci
          for i in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:3000/ -o /tmp/home.html; then break; fi
            sleep 1
          done
          docker logs plato
          grep -q "Plato" /tmp/home.html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Content check
        # The script arrives with T07. It runs the display check (§11.4), which
        # needs the build and the browser, so it comes after both.
        run: npm run content:check --if-present

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
