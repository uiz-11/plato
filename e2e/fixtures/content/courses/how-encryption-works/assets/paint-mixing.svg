<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="paint-title">
  <title id="paint-title">Diffie–Hellman paint mixing</title>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="80" cy="50" r="22"/>
    <circle cx="400" cy="50" r="22"/>
    <circle cx="80" cy="150" r="22"/>
    <circle cx="400" cy="150" r="22"/>
    <circle cx="80" cy="250" r="22"/>
    <circle cx="400" cy="250" r="22"/>
    <path d="M80 72v56M400 72v56M80 172v56M400 172v56"/>
    <path d="M104 150 376 248M376 150 104 248" stroke-dasharray="6 4"/>
  </g>
  <g fill="currentColor" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="80" y="18">Alice</text>
    <text x="400" y="18">Bob</text>
    <text x="80" y="55">g</text>
    <text x="400" y="55">g</text>
    <text x="80" y="155">A</text>
    <text x="400" y="155">B</text>
    <text x="80" y="255">s</text>
    <text x="400" y="255">s</text>
    <text x="140" y="104" text-anchor="start">+ secret a</text>
    <text x="340" y="104" text-anchor="end">+ secret b</text>
    <text x="240" y="186">swap in public</text>
    <text x="240" y="292">same shared secret</text>
  </g>
</svg>
